dataset_path: lmms-lab/charades_sta
dataset_kwargs:
  cache_dir: charades_sta_tvg
  video: True
  video_subdir: Charades_v1_480
task: charades_sta
test_split: test
output_type: generate_until
doc_to_visual: !function charades_sta_utils.tvg_doc_to_visual
doc_to_text: !function charades_sta_utils.tvg_doc_to_text
doc_to_target: !function charades_sta_utils.tvg_doc_to_target
process_results: !function charades_sta_utils.tvg_process_results
generation_kwargs:
  max_new_tokens: 256
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: iou_0.3
    aggregation: !function charades_sta_utils.tvg_aggregate_iou_03
    higher_is_better: true
  - metric: iou_0.5
    aggregation: !function charades_sta_utils.tvg_aggregate_iou_05
    higher_is_better: true
  - metric: iou_0.7
    aggregation: !function charades_sta_utils.tvg_aggregate_iou_07
    higher_is_better: true
  - metric: m_iou
    aggregation: !function charades_sta_utils.tvg_aggregate_m_iou
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # One verbatim ET-Instruct SFT instruction; {query} is replaced with the doc's query text.
    # The format clause must match TRAINING: avtr/data/imagine.py rewrites "From <t>a</t>s to
    # <t>b</t>s" to "[a, b]" (avtr/data/targets.py:to_bracket_tg), so this is that rewritten
    # instruction verbatim. A checkpoint trained on the raw <t> format needs the <t> clause back.
    post_prompt: "Detect and report the start and end timestamps of the video segment that semantically matches the given textual query '{query}'. Answer in the format: [start_time, end_time]."
