# HF repo DreamMr/HR-Bench: hr_bench_8k.parquet loads as a one-file 'train' split; utils decodes
# the base64 image + folds A/B/C/D into the question.
dataset_path: DreamMr/HR-Bench
dataset_kwargs:
  data_files: hr_bench_8k.parquet
task: hrbench_8k
test_split: train
output_type: generate_until
doc_to_visual: !function utils.hrbench_doc_to_visual
doc_to_text: !function utils.hrbench_doc_to_text
doc_to_target: !function utils.hrbench_doc_to_target
process_results: !function utils.hrbench_process_results
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: accuracy
    aggregation: !function utils.hrbench_aggregate_accuracy
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Answer the multiple-choice question. Put your final answer (the option letter) within \\boxed{}."
