dataset_path: FlagEval/ERQA
dataset_kwargs:
  data_files:
    test: data/test-00000-of-00001.parquet
task: erqa
test_split: test
output_type: generate_until
doc_to_visual: !function utils.erqa_doc_to_visual
doc_to_text: !function utils.erqa_doc_to_text
doc_to_target: !function utils.erqa_doc_to_target
process_docs: !function utils.erqa_process_docs
process_results: !function utils.erqa_process_results
generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: accuracy
    aggregation: !function utils.erqa_aggregate_accuracy
    higher_is_better: true
# ERQA bakes the answer-format instruction INTO the question ("Please answer
# directly with only the letter of the correct option and nothing else."), so no
# extra post_prompt is needed.
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
