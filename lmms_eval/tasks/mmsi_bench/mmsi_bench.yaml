dataset_path: RunsenXu/MMSI-Bench
dataset_kwargs:
  data_files:
    test: MMSI_Bench.parquet
task: mmsi_bench
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmsi_doc_to_visual
doc_to_text: !function utils.mmsi_doc_to_text
doc_to_target: !function utils.mmsi_doc_to_target
process_docs: !function utils.mmsi_process_docs
process_results: !function utils.mmsi_process_results
generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: accuracy
    aggregation: !function utils.mmsi_aggregate_accuracy
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Answer with the option's letter from the given choices directly. Output only a single letter (e.g. A)."
